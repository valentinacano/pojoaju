<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando — {{ word }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e0e7ff;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .log-line {
            opacity: 0;
            transform: translateY(4px);
            transition: all 0.25s ease;
        }

        .log-line.show {
            opacity: 1;
            transform: translateY(0);
        }

        .progress-bar-inner {
            transition: width 0.4s ease;
            background: linear-gradient(90deg, #6366f1, #818cf8);
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center px-4">

    <div class="bg-white rounded-2xl shadow-sm border border-indigo-100 p-8 w-full max-w-lg text-center">

        <div id="spinnerWrap" class="flex justify-center mb-5">
            <div class="spinner"></div>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-1">
            Procesando <span class="text-indigo-600">"{{ word }}"</span>
        </h1>
        <p class="text-gray-400 text-sm mb-6">Normalizando frames y extrayendo keypoints...</p>

        <!-- Barra de progreso -->
        <div class="w-full bg-gray-100 rounded-full h-3 mb-2 overflow-hidden">
            <div id="progressBar" class="progress-bar-inner h-3 rounded-full" style="width:0%"></div>
        </div>
        <p id="progressLabel" class="text-xs text-gray-400 mb-6">0 / 0 muestras</p>

        <!-- Log -->
        <div id="logBox" class="text-left bg-gray-50 border border-gray-100 rounded-xl p-4 text-sm
                    font-mono text-gray-600 space-y-1 max-h-56 overflow-y-auto">
        </div>
    </div>

    <script>
        const word = {{ word | tojson }};
        const wordId = {{ word_id | tojson }};
        const logBox = document.getElementById("logBox");
        const bar = document.getElementById("progressBar");
        const label = document.getElementById("progressLabel");

        const es = new EventSource(`/save_samples/progress/${wordId}/${word}`);

        es.onmessage = function (e) {
            const msg = e.data;

            if (msg === "DONE") {
                es.close();
                window.location.href = `/save_samples/done/${wordId}/${word}`;
                return;
            }

            const match = msg.match(/^PROGRESS:(\d+)\/(\d+)$/);
            if (match) {
                const cur = parseInt(match[1]);
                const tot = parseInt(match[2]);
                const pct = Math.round(cur / tot * 100);
                bar.style.width = pct + "%";
                label.textContent = `${cur} / ${tot} muestras`;
                return;
            }

            const line = document.createElement("div");
            line.className = "log-line";
            line.textContent = msg;
            logBox.appendChild(line);
            requestAnimationFrame(() => line.classList.add("show"));
            logBox.scrollTop = logBox.scrollHeight;
        };
    </script>
</body>

</html>
