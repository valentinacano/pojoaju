<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traducir Señas — Pojoaju</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        .badge-accepted { background: #e8f4ef; color: #2d6a4f; border: 1px solid #9fd3bc; }
        .badge-rejected { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="flex justify-between items-center px-6 py-4">
        <a href="{{ url_for('index') }}" class="btn btn-light back-button">
            <img src="{{ url_for('static', filename='img/BackButton.svg') }}" alt="Back" class="back-arrow">
        </a>
        <button class="icon-primary-button flex items-center gap-2 text-white bg-indigo-500 px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
            <img src="{{ url_for('static', filename='img/InfoWhite.svg') }}" alt="Help" class="w-5 h-5">
            <span>Ayuda</span>
        </button>
    </nav>

    <div class="flex flex-col items-center px-4 pb-12">
        <h1 class="text-3xl md:text-4xl font-bold mb-6">Traducción de Señas en Vivo</h1>

        <!-- Cámara limpia -->
        <img src="{{ url_for('video_feed_prediction') }}"
             width="720" height="540" class="rounded-xl shadow mb-4">

        <!-- Última detección -->
        <div class="w-full max-w-2xl bg-white rounded-xl shadow p-4 mb-4">
            <h2 class="text-sm font-medium text-gray-400 mb-2">Última seña detectada</h2>
            <div id="lastDetection" class="flex items-center gap-3 min-h-10">
                <span class="text-gray-300 text-sm">Esperando señas...</span>
            </div>
        </div>

        <!-- Señas acumuladas -->
        <div class="w-full max-w-2xl bg-white rounded-xl shadow p-4 mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-gray-700">Señas detectadas</h2>
                <button onclick="clearPhrase()"
                    class="text-sm px-3 py-1 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition">
                    🗑 Limpiar
                </button>
            </div>
            <div id="signsBox"
                 class="min-h-10 px-4 py-3 bg-gray-50 rounded-xl border border-gray-200 text-lg font-medium text-indigo-700 tracking-wide">
                <span class="text-gray-400 text-sm">Las señas aparecerán acá...</span>
            </div>
        </div>

        <!-- Traducción -->
        <div class="w-full max-w-2xl bg-white rounded-xl shadow p-4 mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-gray-700">Traducción al español</h2>
                <button onclick="translatePhrase()" id="translateBtn"
                    class="px-4 py-2 bg-indigo-500 text-white font-semibold rounded-lg hover:bg-indigo-600 transition text-sm">
                    ✨ Traducir frase
                </button>
            </div>
            <div id="translationBox"
                 class="min-h-10 px-4 py-3 bg-indigo-50 rounded-xl border border-indigo-200 text-lg text-gray-800">
                <span class="text-gray-400 text-sm">La traducción aparecerá acá...</span>
            </div>
            <div id="loadingTranslation" class="text-center text-sm text-indigo-500 mt-2" style="display:none">
                ⏳ Traduciendo con IA...
            </div>
        </div>

        <div id="errorMsg" class="w-full max-w-2xl p-3 bg-red-50 text-red-600 rounded-lg text-sm" style="display:none"></div>
    </div>

    <script>
        let lastPredWord = "";

        async function updateState() {
            try {
                // Última predicción
                const rp = await fetch("/api/last_prediction");
                const dp = await rp.json();
                if (dp.word && dp.word !== lastPredWord) {
                    lastPredWord = dp.word;
                    const badgeClass = dp.accepted ? "badge-accepted" : "badge-rejected";
                    const icon = dp.accepted ? "✔" : "✗";
                    document.getElementById("lastDetection").innerHTML = `
                        <span class="text-xl font-semibold text-gray-800">${dp.word}</span>
                        <span class="text-sm px-2 py-0.5 rounded-full ${badgeClass}">${dp.conf}% ${icon}</span>
                    `;
                }

                // Señas acumuladas — siempre renderizar desde el servidor
                const rs = await fetch("/api/current_phrase");
                const ds = await rs.json();
                const box = document.getElementById("signsBox");
                if (ds.signs.length > 0) {
                    box.innerHTML = `<span>${ds.signs.join(" ")}</span>`;
                } else {
                    box.innerHTML = `<span class="text-gray-400 text-sm">Las señas aparecerán acá...</span>`;
                }

            } catch(e) { console.error(e); }
        }

        async function translatePhrase() {
            const btn = document.getElementById("translateBtn");
            const loading = document.getElementById("loadingTranslation");
            const box = document.getElementById("translationBox");
            const errorMsg = document.getElementById("errorMsg");

            btn.disabled = true;
            loading.style.display = "block";
            errorMsg.style.display = "none";

            try {
                const r = await fetch("/api/translate_phrase", { method: "POST" });
                const d = await r.json();
                if (d.success) {
                    box.innerHTML = `<span>${d.translation}</span>`;
                    document.getElementById("signsBox").innerHTML =
                        `<span class="text-gray-400 text-sm">Las señas aparecerán acá...</span>`;
                } else {
                    errorMsg.textContent = d.error;
                    errorMsg.style.display = "block";
                }
            } catch(e) {
                errorMsg.textContent = "Error al traducir.";
                errorMsg.style.display = "block";
            } finally {
                btn.disabled = false;
                loading.style.display = "none";
            }
        }

        async function clearPhrase() {
            await fetch("/api/clear_phrase", { method: "POST" });
            document.getElementById("signsBox").innerHTML =
                `<span class="text-gray-400 text-sm">Las señas aparecerán acá...</span>`;
            document.getElementById("translationBox").innerHTML =
                `<span class="text-gray-400 text-sm">La traducción aparecerá acá...</span>`;
            document.getElementById("lastDetection").innerHTML =
                `<span class="text-gray-300 text-sm">Esperando señas...</span>`;
            lastPredWord = "";
        }

        setInterval(updateState, 800);
        updateState();
    </script>
</body>
</html>
