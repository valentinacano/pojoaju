<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz a Señas — Pojoaju</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        canvas { background: #f8f7f4; border-radius: 12px; border: 1px solid #e2e0d8; }
        .word-tag { display: inline-block; padding: 4px 12px; background: #f1f5f9; color: #64748b; border-radius: 999px; font-size: 0.85rem; border: 1px solid #e2e8f0; }
        .sign-pill { display: inline-block; padding: 4px 12px; background: #e0e7ff; color: #3730a3; border-radius: 999px; font-size: 0.85rem; border: 1px solid #a5b4fc; }
        .sign-pill.active { background: #4f46e5; color: white; }
        #progressBar { transition: width 0.1s linear; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 2rem; transition: all 0.2s; }
        .mic-btn.idle { background: #6366f1; box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        .mic-btn.listening { background: #ef4444; animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
            70%  { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="flex justify-between items-center px-6 py-4">
        <a href="{{ url_for('index') }}" class="btn btn-light back-button">
            <img src="{{ url_for('static', filename='img/BackButton.svg') }}" alt="Back" class="back-arrow">
        </a>
        <button class="icon-primary-button flex items-center gap-2 text-white bg-indigo-500 px-4 py-2 rounded-lg">
            <img src="{{ url_for('static', filename='img/InfoWhite.svg') }}" alt="Help" class="w-5 h-5">
            <span>Ayuda</span>
        </button>
    </nav>

    <div class="max-w-3xl mx-auto px-4 pb-12">
        <h1 class="text-3xl font-bold text-center mb-2">Voz a Señas</h1>
        <p class="text-center text-gray-500 mb-6">Hablá una palabra o una frase y el sistema mostrará las señas</p>

        <!-- Panel principal -->
        <div class="bg-white rounded-xl shadow p-6 mb-6">

            <!-- Controles de avatar -->
            <div class="flex flex-wrap gap-3 mb-6 items-center">
                <div class="flex items-center gap-2 bg-gray-100 rounded-xl p-2">
                    <button id="maleBtn" onclick="setGender('male')" class="px-4 py-2 rounded-lg bg-indigo-500 text-white text-sm font-medium">Masculino</button>
                    <button id="femaleBtn" onclick="setGender('female')" class="px-4 py-2 rounded-lg text-gray-700 text-sm font-medium">Femenino</button>
                </div>
                <div class="flex items-center gap-3 bg-gray-100 rounded-xl px-4 py-3">
                    <span class="text-sm text-gray-600">Velocidad</span>
                    <input type="range" min="2" max="20" value="8" id="speedRange" oninput="changeSpeed(this.value)">
                    <span id="speedLabel" class="text-sm font-semibold text-indigo-600">8 FPS</span>
                </div>
                <div class="flex items-center gap-3 bg-gray-100 rounded-xl px-4 py-3">
                    <span class="text-sm text-gray-600">Suavizado</span>
                    <input type="range" min="10" max="70" value="35" id="smoothRange" oninput="changeSmoothing(this.value)">
                    <span id="smoothLabel" class="text-sm font-semibold text-indigo-600">35%</span>
                </div>
            </div>

            <!-- Micrófono -->
            <div class="flex flex-col items-center gap-4">
                <button class="mic-btn idle" id="micBtn" onclick="toggleListening()">🎤</button>
                <p id="statusText" class="text-gray-500 text-sm">Hacé clic para empezar a escuchar</p>

                <div id="transcriptBox"
                     class="w-full min-h-12 px-4 py-3 bg-gray-50 rounded-xl border border-gray-200 text-center text-lg font-medium text-gray-700"
                     style="display:none"></div>

                <!-- Secuencia generada -->
                <div id="sequenceSection" class="w-full" style="display:none">
                    <p class="text-sm text-gray-400 mb-2">Secuencia de señas:</p>
                    <div id="sequencePills" class="flex flex-wrap gap-2 mb-3"></div>
                    <div class="flex items-center gap-3 bg-gray-100 rounded-xl px-4 py-3">
                        <span class="text-sm text-gray-600">Pausa entre señas</span>
                        <input type="range" min="5" max="60" value="20" id="pauseRange" oninput="document.getElementById('pauseLabel').textContent = this.value + ' frames'">
                        <span id="pauseLabel" class="text-sm font-semibold text-indigo-600">20 frames</span>
                    </div>
                </div>

                <!-- Lista de palabras disponibles (solo informativa) -->
                <div class="w-full mt-2">
                    <p class="text-sm text-gray-400 mb-2">Palabras disponibles en el diccionario:</p>
                    <div class="flex flex-wrap gap-2">
                        {% for word in available_words %}
                        <span class="word-tag">{{ word }}</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <!-- Animación -->
        <div class="bg-white rounded-xl shadow p-6" id="animationSection" style="display:none">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-xl font-semibold" id="currentWord"></h2>
                    <p class="text-xs text-gray-400 mt-1" id="seqProgress" style="display:none"></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="togglePlay()" id="playBtn" class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition text-sm font-medium">⏸ Pausar</button>
                    <button onclick="restartAnimation()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm font-medium">🔄 Repetir</button>
                </div>
            </div>

            <div class="flex justify-center mb-4">
                <canvas id="stickmanCanvas" width="400" height="400"></canvas>
            </div>

            <div class="w-full bg-gray-100 rounded-full h-2 mb-2">
                <div id="progressBar" class="bg-indigo-500 h-2 rounded-full" style="width:0%"></div>
            </div>
            <div class="flex justify-between text-xs text-gray-400">
                <span id="frameLabel">Frame 0</span>
                <span id="totalFrames"></span>
            </div>
            <div id="errorMsg" class="mt-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm" style="display:none"></div>
        </div>
    </div>

    <script>
    // ── Estado ──
    let animData = null, currentFrame = 0, animInterval = null, isPlaying = false;
    let FPS = 8, avatarGender = "male", SMOOTHING = 0.35;
    let previousSmoothedFrame = null;
    let currentSequence = [], currentSeqIdx = 0, isPlayingSeq = false;
    let recognition = null, isListening = false;

    const canvas = document.getElementById("stickmanCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    // ── Controles ──
    function setGender(gender) {
        avatarGender = gender;
        document.getElementById("maleBtn").className = "px-4 py-2 rounded-lg text-sm font-medium " + (gender === "male" ? "bg-indigo-500 text-white" : "text-gray-700");
        document.getElementById("femaleBtn").className = "px-4 py-2 rounded-lg text-sm font-medium " + (gender === "female" ? "bg-pink-500 text-white" : "text-gray-700");
        if (animData && animData.frames[currentFrame]) drawFrame(animData.frames[currentFrame]);
    }

    function changeSpeed(v) {
        FPS = Number(v);
        document.getElementById("speedLabel").textContent = FPS + " FPS";
        if (isPlaying && animData) { stopAnimation(); startAnimation(); }
    }

    function changeSmoothing(v) {
        SMOOTHING = Number(v) / 100;
        document.getElementById("smoothLabel").textContent = v + "%";
    }

    // ── Web Speech API ──
    let accumulatedText = "";

    function initSpeechRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Tu navegador no soporta reconocimiento de voz. Usá Chrome."); return false; }
        recognition = new SR();
        recognition.lang = "es-PY";
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const t = event.results[i][0].transcript.trim().toLowerCase();
                if (event.results[i].isFinal) {
                    accumulatedText += (accumulatedText ? " " : "") + t;
                } else {
                    interim = t;
                }
            }
            showTranscript(accumulatedText + (interim ? " " + interim : ""), false);
        };

        recognition.onerror = (e) => {
            if (e.error !== "no-speech") setStatus("Error: " + e.error, "text-red-500");
        };
        recognition.onend = () => { if (isListening) recognition.start(); };
        return true;
    }

    function toggleListening() {
        if (!isListening) {
            if (!recognition && !initSpeechRecognition()) return;
            accumulatedText = "";
            recognition.start();
            isListening = true;
            document.getElementById("micBtn").className = "mic-btn listening";
            document.getElementById("micBtn").textContent = "⏹";
            setStatus("Grabando... hablá ahora. Tocá de nuevo para finalizar.", "text-red-500");
            document.getElementById("transcriptBox").style.display = "block";
            document.getElementById("transcriptBox").textContent = "";
        } else {
            recognition.stop();
            isListening = false;
            document.getElementById("micBtn").className = "mic-btn idle";
            document.getElementById("micBtn").textContent = "🎤";
            const phrase = accumulatedText.trim();
            if (phrase) {
                setStatus("Convirtiendo con IA...", "text-indigo-500");
                showTranscript(phrase, true);
                convertAndPlay(phrase);
            } else {
                setStatus("No se detectó ninguna frase. Intentá de nuevo.", "text-orange-500");
                document.getElementById("transcriptBox").style.display = "none";
            }
        }
    }

    async function convertAndPlay(phrase) {
        try {
            const r = await fetch("/api/phrase_to_signs", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phrase })
            });
            const d = await r.json();

            if (!d.success || !d.sequence.length) {
                setStatus("No se encontraron señas para eso.", "text-orange-500");
                return;
            }

            currentSequence = d.sequence;
            renderSequencePills(d.sequence);
            document.getElementById("sequenceSection").style.display = "block";
            setStatus("Reproduciendo...", "text-green-500");
            isPlayingSeq = true;
            currentSeqIdx = 0;
            await playNextInSequence();

        } catch(e) {
            setStatus("Error al conectar con el servidor.", "text-red-500");
        }
    }

    function renderSequencePills(sequence) {
        const container = document.getElementById("sequencePills");
        container.innerHTML = sequence.map((w, i) =>
            `<span class="sign-pill" id="pill-${i}">${i+1}. ${w}</span>`
        ).join("");
    }

    async function playNextInSequence() {
        if (!isPlayingSeq || currentSeqIdx >= currentSequence.length) {
            isPlayingSeq = false;
            document.getElementById("seqProgress").style.display = "none";
            document.querySelectorAll(".sign-pill").forEach(p => p.classList.remove("active"));
            setStatus("Listo. Hablá de nuevo para continuar.", "text-green-500");
            return;
        }
        const word = currentSequence[currentSeqIdx];
        document.querySelectorAll(".sign-pill").forEach(p => p.classList.remove("active"));
        const pill = document.getElementById(`pill-${currentSeqIdx}`);
        if (pill) pill.classList.add("active");
        document.getElementById("seqProgress").style.display = "block";
        document.getElementById("seqProgress").textContent = `Señando: ${currentSeqIdx + 1} de ${currentSequence.length}`;
        await loadSign(word, true);
    }

    function showTranscript(text, isFinal) {
        const box = document.getElementById("transcriptBox");
        box.textContent = text;
        box.style.color = isFinal ? "#1f2937" : "#9ca3af";
    }

    function setStatus(text, cls) {
        const el = document.getElementById("statusText");
        el.textContent = text;
        el.className = "text-sm " + cls;
    }

    // ── Animación ──
    async function loadSign(word, isSeq = false) {
        stopAnimation();
        document.getElementById("animationSection").style.display = "block";
        document.getElementById("currentWord").textContent = `Seña: "${word}"`;
        document.getElementById("errorMsg").style.display = "none";
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#9ca3af"; ctx.font = "16px system-ui"; ctx.textAlign = "center";
        ctx.fillText("Cargando...", W/2, H/2);

        try {
            const r = await fetch(`/api/sign/${encodeURIComponent(word)}`);
            const d = await r.json();
            if (!d.success) {
                document.getElementById("errorMsg").textContent = d.error;
                document.getElementById("errorMsg").style.display = "block";
                ctx.clearRect(0, 0, W, H);
                if (isSeq) { currentSeqIdx++; await playNextInSequence(); }
                return;
            }
            animData = d; currentFrame = 0; previousSmoothedFrame = null;
            document.getElementById("totalFrames").textContent = `${d.frames.length} frames`;
            startAnimation(isSeq);
        } catch(e) {
            document.getElementById("errorMsg").textContent = "Error al cargar la seña.";
            document.getElementById("errorMsg").style.display = "block";
            if (isSeq) { currentSeqIdx++; await playNextInSequence(); }
        }
    }

    function startAnimation(isSeq = false) {
        if (!animData || !animData.frames || !animData.frames.length) return;
        clearInterval(animInterval);
        isPlaying = true;
        document.getElementById("playBtn").textContent = "⏸ Pausar";

        animInterval = setInterval(async () => {
            if (currentFrame >= animData.frames.length) {
                if (isSeq) {
                    const pauseFrames = parseInt(document.getElementById("pauseRange").value);
                    stopAnimation();
                    await new Promise(res => setTimeout(res, (pauseFrames / FPS) * 1000));
                    currentSeqIdx++;
                    await playNextInSequence();
                } else {
                    currentFrame = 0;
                    previousSmoothedFrame = null;
                }
                return;
            }
            const rawFrame = animData.frames[currentFrame];
            drawFrame(smoothFrame(rawFrame));
            const pct = (currentFrame / animData.frames.length) * 100;
            document.getElementById("progressBar").style.width = pct + "%";
            document.getElementById("frameLabel").textContent = `Frame ${currentFrame}`;
            currentFrame++;
        }, 1000 / FPS);
    }

    function stopAnimation() {
        if (animInterval) clearInterval(animInterval);
        animInterval = null; isPlaying = false;
    }

    function togglePlay() {
        if (!animData) return;
        if (isPlaying) { stopAnimation(); document.getElementById("playBtn").textContent = "▶ Reproducir"; }
        else startAnimation();
    }

    function restartAnimation() {
        isPlayingSeq = false;
        stopAnimation(); currentFrame = 0; previousSmoothedFrame = null;
        if (animData) startAnimation();
    }

    // ── Smoothing ──
    function smoothFrame(frame) {
        if (!frame) return frame;
        if (!previousSmoothedFrame) { previousSmoothedFrame = JSON.parse(JSON.stringify(frame)); return frame; }
        const smoothed = JSON.parse(JSON.stringify(frame));
        ["pose", "left_hand", "right_hand"].forEach(key => {
            if (frame[key] && previousSmoothedFrame[key]) {
                smoothed[key] = frame[key].map((point, i) => {
                    const prev = previousSmoothedFrame[key][i];
                    if (!point || !prev) return point;
                    if (point.x === 0 && point.y === 0) return point;
                    return { ...point, x: prev.x + (point.x - prev.x) * SMOOTHING, y: prev.y + (point.y - prev.y) * SMOOTHING };
                });
            }
        });
        previousSmoothedFrame = smoothed;
        return smoothed;
    }

    // ── Draw (idéntico a text_to_sign) ──
    function drawFrame(frame) {
        ctx.clearRect(0, 0, W, H);
        function sx(x) { return x * W; }
        function sy(y) { return y * H; }
        function ok(p) { return p && !(p.x === 0 && p.y === 0); }
        function P(arr, i) { return ok(arr[i]) ? { x: sx(arr[i].x), y: sy(arr[i].y), z: arr[i].z || 0 } : null; }

        const pose = frame.pose || [], lh = frame.left_hand || [], rh = frame.right_hand || [];
        const nose = P(pose,0), leftShoulder = P(pose,11), rightShoulder = P(pose,12);
        const leftElbow = P(pose,13), rightElbow = P(pose,14), leftWrist = P(pose,15), rightWrist = P(pose,16);
        const leftHip = P(pose,23), rightHip = P(pose,24);
        const leftKnee = P(pose,25), rightKnee = P(pose,26), leftAnkle = P(pose,27), rightAnkle = P(pose,28);

        const bg = ctx.createLinearGradient(0,0,0,H);
        bg.addColorStop(0, "#fbfaf7"); bg.addColorStop(1, "#eee9df");
        ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

        ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = "#8b7d6b";
        ctx.beginPath(); ctx.ellipse(W/2, H*0.86, 112, 22, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

        const skin1 = avatarGender === "female" ? "#ffe0ec" : "#ffe1c7";
        const skin2 = avatarGender === "female" ? "#f2a8c7" : "#d98e68";
        const suit1 = avatarGender === "female" ? "#ff85c8" : "#8f86ff";
        const suit2 = avatarGender === "female" ? "#ec4899" : "#5b50d8";
        const suit3 = avatarGender === "female" ? "#be185d" : "#3d348f";
        const hairColor = avatarGender === "female" ? "#5b176e" : "#1f2937";

        function roundedCapsule(x, y, len, width) {
            const r = width/2;
            ctx.beginPath();
            ctx.moveTo(x+r, y-r); ctx.lineTo(x+len-r, y-r);
            ctx.quadraticCurveTo(x+len, y-r, x+len, y); ctx.quadraticCurveTo(x+len, y+r, x+len-r, y+r);
            ctx.lineTo(x+r, y+r); ctx.quadraticCurveTo(x, y+r, x, y); ctx.quadraticCurveTo(x, y-r, x+r, y-r);
            ctx.closePath();
        }

        function drawCapsule(a, b, width, color1, color2, shadow=true) {
            if (!a || !b) return;
            const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy);
            if (len < 2) return;
            ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(Math.atan2(dy,dx));
            if (shadow) { ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle="#111827"; roundedCapsule(5,7,len,width); ctx.fill(); ctx.restore(); }
            const grad = ctx.createLinearGradient(0,-width/2,0,width/2);
            grad.addColorStop(0,color1); grad.addColorStop(0.5,color2); grad.addColorStop(1,suit3);
            ctx.fillStyle = grad; roundedCapsule(0,0,len,width); ctx.fill();
            ctx.strokeStyle = "rgba(37,35,63,0.18)"; ctx.lineWidth=1; roundedCapsule(0,0,len,width); ctx.stroke();
            ctx.restore();
        }

        function drawJoint(p, r, c1, c2) {
            if (!p) return;
            const g = ctx.createRadialGradient(p.x-r*0.35, p.y-r*0.45, r*0.2, p.x, p.y, r);
            g.addColorStop(0,c1); g.addColorStop(1,c2);
            ctx.save(); ctx.shadowColor="rgba(31,41,55,0.22)"; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
        }

        function drawTorso() {
            if (!leftShoulder || !rightShoulder) return;
            const cx = (leftShoulder.x+rightShoulder.x)/2;
            const shoulderY = (leftShoulder.y+rightShoulder.y)/2;
            const hipY = leftHip && rightHip ? (leftHip.y+rightHip.y)/2 : shoulderY+105;
            const shoulderW = Math.max(62, Math.abs(rightShoulder.x-leftShoulder.x)+34);
            const hipW = leftHip && rightHip ? Math.max(48, Math.abs(rightHip.x-leftHip.x)+28) : shoulderW*0.68;
            const h = Math.max(78, hipY-shoulderY+34);
            ctx.save();
            ctx.shadowColor="rgba(31,41,55,0.25)"; ctx.shadowBlur=18; ctx.shadowOffsetY=9;
            const g = ctx.createLinearGradient(cx-shoulderW/2, shoulderY, cx+shoulderW/2, shoulderY+h);
            g.addColorStop(0,suit1); g.addColorStop(0.48,suit2); g.addColorStop(1,suit3);
            ctx.fillStyle=g;
            ctx.beginPath();
            ctx.moveTo(cx-shoulderW/2, shoulderY-4);
            ctx.bezierCurveTo(cx-shoulderW*0.46, shoulderY+h*0.35, cx-hipW*0.52, shoulderY+h*0.72, cx-hipW/2, shoulderY+h);
            ctx.quadraticCurveTo(cx, shoulderY+h+18, cx+hipW/2, shoulderY+h);
            ctx.bezierCurveTo(cx+hipW*0.52, shoulderY+h*0.72, cx+shoulderW*0.46, shoulderY+h*0.35, cx+shoulderW/2, shoulderY-4);
            ctx.quadraticCurveTo(cx, shoulderY-22, cx-shoulderW/2, shoulderY-4);
            ctx.closePath(); ctx.fill();
            ctx.shadowBlur=0; ctx.globalAlpha=0.34; ctx.fillStyle="#ffffff";
            ctx.beginPath(); ctx.ellipse(cx-shoulderW*0.18, shoulderY+h*0.26, shoulderW*0.18, h*0.30, -0.35, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawHead() {
            if (!nose) return;
            const shoulderDistance = leftShoulder && rightShoulder ? Math.abs(rightShoulder.x-leftShoulder.x) : 70;
            const r = Math.max(28, Math.min(48, shoulderDistance*0.42));
            const cx = nose.x, cy = nose.y-r*0.15;
            ctx.save();
            if (avatarGender === "female") {
                ctx.fillStyle=hairColor; ctx.beginPath();
                ctx.ellipse(cx, cy+r*0.18, r*1.08, r*1.35, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.shadowColor="rgba(31,41,55,0.26)"; ctx.shadowBlur=14; ctx.shadowOffsetY=6;
            const g = ctx.createRadialGradient(cx-r*0.35, cy-r*0.45, r*0.18, cx, cy, r);
            g.addColorStop(0,skin1); g.addColorStop(0.6,"#f0b48e"); g.addColorStop(1,skin2);
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur=0;
            ctx.fillStyle=hairColor; ctx.beginPath(); ctx.arc(cx, cy-r*0.18, r, Math.PI, 0); ctx.fill();
            ctx.fillStyle="rgba(17,24,39,0.7)";
            ctx.beginPath(); ctx.arc(cx-r*0.28, cy-r*0.10, 3.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+r*0.28, cy-r*0.10, 3.2, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle="rgba(17,24,39,0.45)"; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(cx, cy+r*0.13, r*0.23, 0.1, Math.PI-0.1); ctx.stroke();
            ctx.restore();
        }

        function drawHand(points, wrist, palmColor1, palmColor2) {
            if (!wrist) return;
            const hasHand = points.some(p => p && (p.x !== 0 || p.y !== 0));
            if (!hasHand) { drawJoint(wrist, 12, palmColor1, palmColor2); return; }
            const hand = points.map((_,i) => P(points,i));
            const base = hand[0] || wrist;
            if (!base) return;
            drawJoint(base, 15, palmColor1, palmColor2);
            for (const [a,b] of (animData.hand_connections || [])) {
                drawCapsule(hand[a], hand[b], 6, palmColor1, palmColor2, false);
            }
            for (const p of hand) drawJoint(p, 3.8, "#fff1df", palmColor2);
        }

        drawTorso();
        drawCapsule(leftHip, leftKnee, 18, suit1, suit2);
        drawCapsule(leftKnee, leftAnkle, 16, suit1, suit2);
        drawCapsule(rightHip, rightKnee, 18, suit1, suit2);
        drawCapsule(rightKnee, rightAnkle, 16, suit1, suit2);
        drawCapsule(leftShoulder, leftElbow, 18, suit1, suit2);
        drawCapsule(leftElbow, leftWrist, 16, suit1, suit2);
        drawCapsule(rightShoulder, rightElbow, 18, suit1, suit2);
        drawCapsule(rightElbow, rightWrist, 16, suit1, suit2);
        [leftShoulder, rightShoulder, leftElbow, rightElbow, leftWrist, rightWrist].forEach(p => drawJoint(p, 9, suit1, suit2));
        drawHead();
        drawHand(lh, leftWrist, skin1, skin2);
        drawHand(rh, rightWrist, skin1, skin2);
    }
    </script>
