<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenar Modelo — Pojoaju</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        .loader { border:5px solid #f3f3f3; border-top:5px solid #6366f1; border-radius:50%;
                  width:40px; height:40px; animation:spin 1s linear infinite; display:none; margin:20px auto; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .metric-card { background:#f9f9f9; border:1px solid #ddd; padding:15px;
                       border-radius:6px; text-align:center; }
        .metric-card h3 { margin:0; font-size:14px; color:#666; }
        .metric-card p { font-size:18px; font-weight:bold; margin:5px 0 0; }
        .green{color:#27ae60} .red{color:#c0392b} .blue{color:#2980b9} .orange{color:#e67e22}
    </style>
</head>
<nav>
    <a href="{{ url_for('training') }}" class="btn btn-light back-button">
        <img src="{{ url_for('static', filename='img/BackButton.svg') }}" alt="Back" class="back-arrow">
    </a>
    <button class="icon-primary-button">
        <img src="{{ url_for('static', filename='img/InfoWhite.svg') }}" alt="Help" class="help-icon">
        <span>Ayuda</span>
    </button>
</nav>
<body>
    <div style="height:80vh; display:flex; width:100vw; justify-content:center; align-items:center; padding:20px;">
        <div style="background:#fff; padding:25px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,.1);
                    width:90%; max-width:700px; display:flex; align-items:center; flex-direction:column; gap:20px;">

            <img src="{{ url_for('static', filename='img/TrainingModel.svg') }}" alt="Modelo" class="px-20">
            <h1 style="color:#333; text-align:center;">Entrenamiento del Modelo</h1>
            <p>Presioná el botón para iniciar. Puede tomar unos minutos.</p>

            <button id="trainButton"
                class="flex items-center justify-center gap-2 px-5 py-3 rounded-xl font-semibold text-white
                       bg-indigo-500 hover:bg-indigo-600 shadow-lg hover:shadow-xl hover:scale-105
                       transition-all duration-300 ring-2 ring-indigo-300 ring-offset-2">
                <span class="text-xl">✓</span>
                <span>Iniciar Entrenamiento</span>
            </button>

            <div id="loader" class="loader"></div>
            <p id="progressMsg" style="display:none; color:#666;">El entrenamiento está en curso...</p>
            <div id="results" style="display:none; width:100%;"></div>
        </div>
    </div>

    <script>
        document.getElementById("trainButton").addEventListener("click", function () {
            const btn = this;
            btn.disabled = true;
            btn.querySelector("span:last-child").textContent = "Entrenando...";
            document.getElementById("loader").style.display = "block";
            document.getElementById("progressMsg").style.display = "block";
            document.getElementById("results").style.display = "none";

            fetch("/train", { method: "POST", headers: { "Content-Type": "application/json" } })
                .then(r => r.json())
                .then(data => {
                    const div = document.getElementById("results");
                    if (data.success) {
                        const r = data.results;
                        div.innerHTML = `
                            <h2 style="margin-bottom:12px;">📊 Resultados</h2>
                            <div class="metrics">
                                <div class="metric-card"><h3>Accuracy</h3><p class="green">${r.accuracy}</p></div>
                                <div class="metric-card"><h3>Val Accuracy</h3><p class="blue">${r.val_accuracy}</p></div>
                                <div class="metric-card"><h3>Loss</h3><p class="red">${r.loss}</p></div>
                                <div class="metric-card"><h3>Val Loss</h3><p class="orange">${r.val_loss}</p></div>
                                <div class="metric-card"><h3>Épocas</h3><p>${r.epochs_ran}</p></div>
                                <div class="metric-card"><h3>Clases</h3><p>${r.n_classes}</p></div>
                            </div>`;
                    } else {
                        div.innerHTML = `<p style="color:red;">❌ Error: ${data.error}</p>`;
                    }
                })
                .catch(e => {
                    document.getElementById("results").innerHTML = `<p style="color:red;">Error: ${e}</p>`;
                })
                .finally(() => {
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("progressMsg").style.display = "none";
                    btn.disabled = false;
                    btn.querySelector("span:last-child").textContent = "Iniciar Entrenamiento";
                    document.getElementById("results").style.display = "block";
                });
        });
    </script>
</body>
</html>
