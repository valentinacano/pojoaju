<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir video — {{ word }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        .upload-label {
            border: 2px dashed #a5b4fc;
            background: white;
            transition: all 0.2s;
        }

        .upload-label:hover,
        .upload-label.has-file {
            background: #eef2ff;
            border-color: #6366f1;
        }

        .upload-label.has-file {
            border-style: solid;
        }

        .stepper {
            display: flex;
            align-items: center;
            border: 2px solid #6366f1;
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .stepper button {
            width: 44px;
            height: 44px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #6366f1;
            background: white;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .stepper button:hover {
            background: #eef2ff;
        }

        .stepper button:active {
            background: #e0e7ff;
        }

        .stepper input {
            width: 56px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #3730a3;
            border: none;
            border-left: 1.5px solid #c7d2fe;
            border-right: 1.5px solid #c7d2fe;
            outline: none;
            height: 44px;
            background: #f5f4ff;
        }

        .stepper input::-webkit-outer-spin-button,
        .stepper input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .stepper input[type=number] {
            -moz-appearance: textfield;
        }

        .hint-badge {
            padding: 4px 12px;
            border-radius: 999px;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: all 0.15s;
        }

        .hint-badge:hover {
            background: #c7d2fe;
        }

        .hint-badge.active {
            background: #6366f1;
            color: white;
            border-color: #4f46e5;
        }

        .preview-thumb {
            display: none;
            width: 100%;
            max-height: 140px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }

        .preview-thumb.show {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <nav class="flex justify-between items-center px-6 py-4">
        <a href="{{ url_for('training_selector', word_id=word_id, word=word) }}" class="btn btn-light back-button">
            <img src="{{ url_for('static', filename='img/BackButton.svg') }}" alt="Volver" class="back-arrow">
        </a>
        <button
            class="icon-primary-button flex items-center gap-2 text-white bg-indigo-600 px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
            <img src="{{ url_for('static', filename='img/InfoWhite.svg') }}" alt="Ayuda" class="help-icon w-5 h-5">
            <span>Ayuda</span>
        </button>
    </nav>

    <div class="flex flex-col justify-center items-center px-4 text-center" style="min-height: calc(100vh - 72px);">
        <h1 class="text-3xl md:text-4xl font-bold mb-1">
            Subir video para: <span class="text-indigo-600">"{{ word }}"</span>
        </h1>
        <p class="text-gray-400 text-sm mb-6">Seleccioná el archivo y cuántas muestras extraer del loop</p>

        <form action="{{ url_for('upload_video', word_id=word_id, word=word) }}" method="POST"
            enctype="multipart/form-data" class="flex flex-col items-center gap-5 w-full max-w-md">

            <!-- Zona de subida -->
            <label id="uploadLabel"
                class="upload-label flex flex-col items-center justify-center w-full px-4 py-6 rounded-2xl cursor-pointer">
                <input type="file" name="video_file" id="video_file" accept="video/*" required class="sr-only">
                <svg id="uploadIcon" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 mb-2 text-indigo-400"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" />
                </svg>
                <span class="text-sm font-medium text-indigo-600" id="fileLabel">Elegí un archivo de video</span>
                <video id="videoPreview" class="preview-thumb" muted></video>
            </label>

            <!-- Selector de muestras -->
            <div class="w-full bg-white rounded-2xl p-4 shadow-sm border border-indigo-100 text-left">
                <p class="text-sm font-semibold text-gray-600 mb-3 text-center">
                    ¿Cuántas muestras querés extraer?
                </p>

                <!-- Atajos rápidos -->
                <div class="flex gap-2 flex-wrap justify-center mb-3">
                    <span class="hint-badge active" data-val="10">10</span>
                    <span class="hint-badge" data-val="20">20</span>
                    <span class="hint-badge" data-val="30">30</span>
                    <span class="hint-badge" data-val="50">50</span>
                </div>

                <!-- Stepper -->
                <div class="stepper mx-auto" style="width: fit-content;">
                    <button type="button" id="decBtn">−</button>
                    <input type="number" id="sampleCount" name="sample_count" value="10" min="1" max="200">
                    <button type="button" id="incBtn">+</button>
                </div>

                <p class="text-xs text-gray-400 mt-2 text-center">
                    Se extraerán fotogramas distribuidos a lo largo del video
                </p>
            </div>

            <!-- Botón de envío -->
            <button type="submit" id="submitBtn" disabled class="w-full px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow-lg
                       hover:bg-indigo-700 hover:scale-105 transition-all duration-300
                       disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                Subir y procesar
            </button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('video_file');
        const fileLabel = document.getElementById('fileLabel');
        const uploadLabel = document.getElementById('uploadLabel');
        const uploadIcon = document.getElementById('uploadIcon');
        const videoPreview = document.getElementById('videoPreview');
        const submitBtn = document.getElementById('submitBtn');
        const sampleInput = document.getElementById('sampleCount');
        const badges = document.querySelectorAll('.hint-badge');
        const decBtn = document.getElementById('decBtn');
        const incBtn = document.getElementById('incBtn');

        // Selección de archivo
        fileInput.addEventListener('change', function () {
            if (this.files.length > 0) {
                fileLabel.textContent = this.files[0].name;
                uploadLabel.classList.add('has-file');
                uploadIcon.classList.add('hidden');
                videoPreview.src = URL.createObjectURL(this.files[0]);
                videoPreview.classList.add('show');
                submitBtn.disabled = false;
            }
        });

        // Stepper
        decBtn.addEventListener('click', () => {
            let v = parseInt(sampleInput.value) || 10;
            if (v > 1) { sampleInput.value = v - 1; syncBadges(v - 1); }
        });
        incBtn.addEventListener('click', () => {
            let v = parseInt(sampleInput.value) || 10;
            if (v < 200) { sampleInput.value = v + 1; syncBadges(v + 1); }
        });
        sampleInput.addEventListener('input', () => syncBadges(parseInt(sampleInput.value)));

        // Atajos rápidos
        badges.forEach(badge => {
            badge.addEventListener('click', () => {
                sampleInput.value = badge.dataset.val;
                syncBadges(parseInt(badge.dataset.val));
            });
        });

        function syncBadges(val) {
            badges.forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === val));
        }
    </script>
</body>

</html>
