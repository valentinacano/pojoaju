<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Confusión — Pojoaju</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        .spinner {
            border: 3px solid #e0e7ff;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg)
            }

            100% {
                transform: rotate(360deg)
            }
        }
    </style>
</head>
<nav>
    <a href="{{ url_for('index') }}" class="btn btn-light back-button">
        <img src="{{ url_for('static', filename='img/BackButton.svg') }}" alt="Back" class="back-arrow">
    </a>
    <button class="icon-primary-button">
        <img src="{{ url_for('static', filename='img/InfoWhite.svg') }}" alt="Help" class="help-icon">
        <span>Ayuda</span>
    </button>
</nav>

<body>
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center">
            <h1 class="text-4xl header-bold my-5 pb-4">Matriz de Confusión</h1>
            <button onclick="generateMatrix()" id="generateBtn" class="flex items-center gap-2 px-5 py-3 rounded-xl font-semibold text-white bg-indigo-500
                       hover:bg-indigo-600 shadow-indigo-400 shadow-lg hover:shadow-xl hover:scale-105
                       transition-all duration-300 ring-2 ring-indigo-300 ring-offset-2">
                <span class="text-white text-xl">⚡</span>
                <span class="text-white">Generar Matriz</span>
            </button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="metricsSection" style="display:none">
            <div class="bg-white rounded-xl p-6 flex items-center shadow-sm">
                <div class="bg-indigo-50 w-12 h-12 rounded-full flex items-center justify-center mr-4">
                    <img src="{{ url_for('static', filename='img/BookOpenText.svg') }}" alt="Accuracy">
                </div>
                <div>
                    <div class="text-gray-500 text-lg">Accuracy</div>
                    <h3 class="text-3xl font-semibold" id="metricAccuracy">—</h3>
                </div>
            </div>
            <div class="bg-white rounded-xl p-6 flex items-center shadow-sm">
                <div class="bg-green-50 w-12 h-12 rounded-full flex items-center justify-center mr-4">
                    <img src="{{ url_for('static', filename='img/CheckCircle.svg') }}" alt="Clases">
                </div>
                <div>
                    <div class="text-gray-500 text-md">Clases</div>
                    <h3 class="text-3xl font-semibold" id="metricClasses">—</h3>
                </div>
            </div>
            <div class="bg-white rounded-xl p-6 flex items-center shadow-sm">
                <div class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center mr-4">
                    <img src="{{ url_for('static', filename='img/XCircle.svg') }}" alt="Muestras">
                </div>
                <div>
                    <div class="text-gray-500 text-md">Muestras</div>
                    <h3 class="text-3xl font-semibold" id="metricSamples">—</h3>
                </div>
            </div>
        </div>

        <!-- Error -->
        <div id="errorMsg" class="bg-red-50 text-red-600 rounded-xl p-4 mb-6 text-sm" style="display:none"></div>

        <!-- Loading -->
        <div id="loading" class="bg-white rounded-lg p-8 shadow-sm text-center mb-6" style="display:none">
            <div class="spinner mb-4"></div>
            <p class="text-gray-400 text-sm">Generando matriz... puede tomar unos minutos.</p>
        </div>

        <!-- Imagen -->
        <div class="bg-white rounded-lg p-6 shadow-sm mt-6" id="matrixSection" style="display:none">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h5 class="text-lg font-medium mb-1">Resultado</h5>
                    <div class="text-green-500 text-sm" id="lastGenerated"></div>
                </div>
            </div>
            <div class="text-center">
                <img id="matrixImage" src="" alt="Matriz de Confusión" class="max-w-full rounded-xl shadow-sm mx-auto">
            </div>
        </div>

        <!-- Confusiones -->
        <div class="bg-white rounded-lg p-6 shadow-sm mt-6" id="confusionsSection" style="display:none">
            <div class="mb-6">
                <h5 class="text-lg font-medium mb-1">Principales Confusiones</h5>
                <div class="text-red-400 text-sm">Errores más frecuentes del modelo</div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-gray-100">
                            <th class="text-left py-3 px-4 font-normal text-gray-500">Palabra Real</th>
                            <th class="text-left py-3 px-4 font-normal text-gray-500">Predicción Incorrecta</th>
                            <th class="text-left py-3 px-4 font-normal text-gray-500">Errores</th>
                        </tr>
                    </thead>
                    <tbody id="confusionsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Mostrar imagen existente al cargar
        window.addEventListener("DOMContentLoaded", async () => {
            try {
                const r = await fetch("/api/confusion/status");
                const d = await r.json();
                if (d.exists) {
                    // Forzar path correcto
                    const imgPath = "{{ url_for('static', filename='confusion/confusion_matrix.png') }}";
                    document.getElementById("matrixImage").src = imgPath + "?t=" + Date.now();
                    document.getElementById("matrixSection").style.display = "block";
                    if (d.last_generated)
                        document.getElementById("lastGenerated").textContent = "Generada: " + d.last_generated;
                }
            } catch (e) { console.error(e); }
        });

        async function generateMatrix() {
            const btn = document.getElementById("generateBtn");
            btn.disabled = true;
            document.getElementById("loading").style.display = "block";
            document.getElementById("errorMsg").style.display = "none";
            document.getElementById("confusionsSection").style.display = "none";

            try {
                const r = await fetch("/api/confusion", { method: "POST" });
                const d = await r.json();

                if (d.success) {
                    document.getElementById("metricAccuracy").textContent = d.accuracy;
                    document.getElementById("metricClasses").textContent = d.n_classes;
                    document.getElementById("metricSamples").textContent = d.n_samples;
                    document.getElementById("metricsSection").style.display = "grid";

                    const imgPath = "{{ url_for('static', filename='confusion/confusion_matrix.png') }}";
                    document.getElementById("matrixImage").src = imgPath + "?t=" + Date.now();
                    document.getElementById("matrixSection").style.display = "block";
                    document.getElementById("lastGenerated").textContent = "Recién generada";

                    if (d.top_confusions && d.top_confusions.length) {
                        document.getElementById("confusionsBody").innerHTML =
                            d.top_confusions.map(c =>
                                `<tr class="border-b border-gray-50">
                                    <td class="py-3 px-4 font-medium">${c.real}</td>
                                    <td class="py-3 px-4">
                                        <span class="bg-red-50 text-red-500 px-4 py-1 rounded-full text-sm">${c.predicted}</span>
                                    </td>
                                    <td class="py-3 px-4">${c.count}</td>
                                </tr>`
                            ).join("");
                        document.getElementById("confusionsSection").style.display = "block";
                    }
                } else {
                    document.getElementById("errorMsg").textContent = "Error: " + (d.error || "Error desconocido");
                    document.getElementById("errorMsg").style.display = "block";
                }
            } catch (e) {
                document.getElementById("errorMsg").textContent = "Error: " + e.message;
                document.getElementById("errorMsg").style.display = "block";
            } finally {
                document.getElementById("loading").style.display = "none";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
