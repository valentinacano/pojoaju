<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muestras guardadas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="min-h-screen flex items-center justify-center" style="background-color: #efefef;">
    <div class="w-full max-w-xl mx-auto p-8 rounded-3xl text-center bg-gray-50 space-y-6 shadow-lg">
        <div>
            <img src="{{ url_for('static', filename='img/CameraCheck.svg') }}"
                 alt="Éxito" class="mx-auto px-20">
        </div>
        <h1 class="text-2xl font-semibold">
            Muestras guardadas para: <span class="italic text-indigo-600">{{ word }}</span>
        </h1>
        <p class="text-sm text-gray-500 break-words">ID: {{ word_id }}</p>
        <div class="flex justify-center gap-4">
            <a href="{{ url_for('dictionary') }}"
               class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg transition"
               style="color:#fff !important;">
                Ver diccionario
            </a>
            <a href="{{ url_for('training') }}"
               class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-semibold py-2 px-4 rounded-lg transition">
                Volver al inicio
            </a>
        </div>
    </div>
</body>
</html>
